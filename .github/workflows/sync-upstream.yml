name: Sync Upstream Snapshot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '忽略快照指纹强制重新同步（新增补丁首次生效时需要）'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run sync and patch script
        id: sync_run
        env:
          FORCE_SYNC: ${{ inputs.force_sync && '1' || '0' }}
        run: |
          chmod +x ./sync.sh
          ./sync.sh

      - name: Commit and push if changed
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(sync): auto-sync ithtelab upstream-src snapshot and re-apply patches"
            git push origin master
            echo "✅ 成功同步并推送到远程 master 分支"
          else
            echo "无需更新：工作区无变更"
          fi

      - name: Close auto-sync failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 [Auto-Sync] 上游快照同步或补丁应用失败"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v t="$TITLE" '$2 == t { print $1; exit }')"
          if [ -z "$EXISTING" ]; then
            echo "无未关闭的同步失败 issue，跳过。"
            exit 0
          fi
          gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
            --body "本次同步已通过，自动关闭该 issue。"
          gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --reason completed
          echo "已关闭 issue #$EXISTING"

      - name: Report failure (create or update issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 [Auto-Sync] 上游快照同步或补丁应用失败"
          BODY="$(printf '%s\n' \
            '检测到 ithtelab/workbuddy-manager 的 upstream-src 快照有更新，但在应用 patches/ 下的本地补丁时发生冲突或错误。' \
            '' \
            "运行日志: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "触发方式: ${GITHUB_EVENT_NAME}" \
            "commit: ${GITHUB_SHA}")"
          # 同一个失败可能连着挂好几天（例如上游改了补丁锚点），
          # 每次都新建 issue 会把列表刷满。已有未关闭的同名 issue 时追加评论。
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v t="$TITLE" '$2 == t { print $1; exit }')"
          if [ -n "$EXISTING" ]; then
            echo "已有未关闭的同名 issue #$EXISTING，追加评论。"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            echo "创建新的同步失败 issue。"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
